<!DOCTYPE html>
<html>
<head>
  <title>Hello </title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: #fff;
      font-family: monospace;
      text-align: center;
      padding-top: 80px;
      overflow: hidden;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    h1 {
      color: #ff4d88;
      font-size: 2.5em;
      text-shadow: 0 0 15px #ff4d88;
    }

    #text {
      font-size: 1.4em;
      margin: 30px auto;
      width: 80%;
      min-height: 60px;
    }

    /* blinking cursor */
    #text::after {
      content: "|";
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* glow pulse */
    #text.glow {
      animation: glowPulse 1s infinite alternate;
    }

    @keyframes glowPulse {
      from { text-shadow: 0 0 5px #ff4d88; }
      to { text-shadow: 0 0 20px #ff4d88; }
    }

    img {
      width: 260px;
      border-radius: 20px;
      margin: 20px 0;
      box-shadow: 0 0 30px #ff4d88;
      filter: blur(10px);
      transition: 0.5s;
    }

    button {
      padding: 12px 25px;
      border: none;
      background: #ff4d88;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1em;
      position: absolute;
      box-shadow: 0 0 15px #ff4d88;
    }

    #yesBtn {
      position: static;
      margin: 15px;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px #ff4d88;
    }

    #buttons {
      display: none;
    }

    video {
      width: 320px;
      border-radius: 20px;
      box-shadow: 0 0 40px #ff4d88;
    }
  </style>
</head>

<body>

  <h1>Hey Nthato ❤️</h1>

  <img id="photo" src="pic1.jpg">

  <div id="text"></div>

  <div id="buttons">
    <button id="yesBtn" onclick="yesClicked()">Yes 😌</button>
    <button id="noBtn">No 🙄</button>
  </div>

  <audio id="clickSound" src="click.mp3"></audio>

  <script>
    const lines = [
      "ngl… I actually like you",
      "and I like us",
      "so I’ll just ask",
      " will you be my girlfriend?"
    ];

    const images = ["pic1.jpg", "pic2.jpg", "pic3.jpg"];

    let i = 0;
    let j = 0;

    function typeEffect() {
      if (i < lines.length) {

        if (j === 0 && i < images.length) {
          changeImage(i);
        }

        if (j <= lines[i].length) {
          document.getElementById("text").innerHTML =
            lines[i].substring(0, j++);
          setTimeout(typeEffect, 40);
        } else {
          if (i === lines.length - 1) {
            document.getElementById("text").classList.add("glow");
          }
          j = 0;
          i++;
          setTimeout(typeEffect, 700);
        }

      } else {
        document.getElementById("buttons").style.display = "block";
        moveNoButton();
      }
    }

    function changeImage(index) {
      const img = document.getElementById("photo");

      img.style.filter = "blur(10px)";

      setTimeout(() => {
        img.src = images[index];
        img.style.filter = "blur(0px)";
      }, 200);
    }

    function yesClicked() {
      document.getElementById("clickSound")?.play();

      document.body.innerHTML = `
        <div style="opacity:0; transition:1s; text-align:center; margin-top:80px;" id="final">
          <h1 style="color:#ff4d88; text-shadow:0 0 20px #ff4d88;">
            Say less 
          </h1>

          <video autoplay loop controls>
            <source src="video.mp4" type="video/mp4">
          </video>
        </div>
      `;

      setTimeout(() => {
        document.getElementById("final").style.opacity = 1;
      }, 100);
    }

    const noBtn = document.getElementById("noBtn");

    function moveNoButton() {
      noBtn.style.top = Math.random() * window.innerHeight + "px";
      noBtn.style.left = Math.random() * window.innerWidth + "px";
    }

    noBtn.addEventListener("mouseover", moveNoButton);

    document.addEventListener("mousemove", e => {
      document.body.style.background =
        `radial-gradient(circle at ${e.clientX}px ${e.clientY}px, #1a1a1a, #000)`;
    });

    typeEffect();
  </script>

</body>
</html>
